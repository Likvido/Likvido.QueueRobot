name: Build

# Compiles the library on every pull request to main. The publish workflow (nuget.yml) only runs on
# a version bump, so without this a commit that does not compile can reach main unnoticed.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Build
        run: dotnet build -c Release src/Likvido.QueueRobot.sln
